services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ohmguard-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=${MONGO_URL}?authSource=admin
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - MQTT_ENABLED=${MQTT_ENABLED}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT}
      - MQTT_PUB_TOPIC=${MQTT_PUB_TOPIC}
      - MQTT_ACK_TOPIC=${MQTT_ACK_TOPIC}
      - CORS_ORIGINS=https://app.ohmguard.fr
    networks:
      - dokploy-network
    expose:
      - "8001"

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=https://app.ohmguard.fr
    container_name: ohmguard-frontend
    restart: unless-stopped
    networks:
      - dokploy-network
    expose:
      - "80"

networks:
  dokploy-network:
    external: true
